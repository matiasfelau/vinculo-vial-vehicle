name: Publicar Imagen Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vehicle
          POSTGRES_PASSWORD: vehicle
          POSTGRES_DB: vehicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle -d vehicle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vehicle:vehicle@localhost:5432/vehicle?sslmode=disable
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configurar Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      - name: Descargar dependencias
        run: go mod download

      - name: Compilar
        run: CGO_ENABLED=0 go build -o vehicle ./cmd/api

      - name: Ejecutar pruebas
        run: go test ./... -v

      - name: Vet
        run: go vet ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extraer versión del tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compilar y publicar la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vinculo-vial-vehicle:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vinculo-vial-vehicle:latest
