name: Publicar Imagen Docker

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vehicle
          POSTGRES_PASSWORD: vehicle
          POSTGRES_DB: vehicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle -d vehicle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vehicle:vehicle@localhost:5432/vehicle?sslmode=disable
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Descargar dependencias
        run: go mod download

      - name: Compilar
        run: CGO_ENABLED=0 go build -o vehicle ./cmd/api

      - name: Ejecutar pruebas
        run: go test ./... -v

      - name: Vet
        run: go vet ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Extraer versión del tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vinculo-vial-vehicle:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vinculo-vial-vehicle:latest
