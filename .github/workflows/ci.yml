name: Build, Test y Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Descargar dependencias
        run: go mod download

      - name: Compilar
        run: CGO_ENABLED=0 go build -o vehicle ./cmd/api

      - name: Ejecutar pruebas
        run: go test ./... -v

      - name: Vet
        run: go vet ./...
