name: Build, Test y Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vehicle
          POSTGRES_PASSWORD: vehicle
          POSTGRES_DB: vehicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle -d vehicle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vehicle:vehicle@localhost:5432/vehicle?sslmode=disable
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Descargar dependencias
        run: go mod download

      - name: Compilar
        run: CGO_ENABLED=0 go build -o vehicle ./cmd/api

      - name: Ejecutar pruebas
        run: go test ./... -v

      - name: Vet
        run: go vet ./...
