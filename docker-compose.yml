services:
  vehicle:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://vehicle:vehicle@vehicle-db:5432/vehicle?sslmode=disable
      VEHICLE_HPKE_PRIVATE_KEY: ${VEHICLE_HPKE_PRIVATE_KEY}
      PAT_AES_KEY: ${PAT_AES_KEY}
      PAT_HMAC_SECRET: ${PAT_HMAC_SECRET}
      IDENTITY_INTERNAL_URL: ${IDENTITY_INTERNAL_URL}
      IDENTITY_TIMEOUT_MS: ${IDENTITY_TIMEOUT_MS:-2000}
      IDENTITY_HPKE_PUBLIC_KEY: ${IDENTITY_HPKE_PUBLIC_KEY}
      MOCK_DNRPA_OWNER_DNI: ${MOCK_DNRPA_OWNER_DNI}
    depends_on:
      vehicle-db:
        condition: service_healthy

  vehicle-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
      POSTGRES_DB: vehicle
    volumes:
      - vehicle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehicle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vehicle-db-data:
