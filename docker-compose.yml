services:
  vinculo-vial-vehicle:
    container_name: vinculo-vial-vehicle
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Deliberadamente sin publicar INTERNAL_PORT: las rutas /internal/* (US-05)
    # no se exponen fuera de la red interna. Alert las alcanza igual dentro de
    # la red `vinculo-vial`, sin necesidad de un `ports:` acá. El secreto
    # INTERNAL_SERVICE_TOKEN es la segunda capa de esa protección.
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://vehicle:vehicle@vinculo-vial-vehicle-db:5432/vehicle?sslmode=disable
      VEHICLE_HPKE_PRIVATE_KEY: ${VEHICLE_HPKE_PRIVATE_KEY}
      PAT_AES_KEY: ${PAT_AES_KEY}
      PAT_HMAC_SECRET: ${PAT_HMAC_SECRET}
      IDENTITY_INTERNAL_URL: ${IDENTITY_INTERNAL_URL}
      IDENTITY_TIMEOUT_MS: ${IDENTITY_TIMEOUT_MS:-2000}
      IDENTITY_HPKE_PUBLIC_KEY: ${IDENTITY_HPKE_PUBLIC_KEY}
      MOCK_DNRPA_OWNER_DNI: ${MOCK_DNRPA_OWNER_DNI}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      EPHEMERAL_DB: ${EPHEMERAL_DB:-false}
    networks:
      - vinculo-vial
      - vehicle-internal
    depends_on:
      vinculo-vial-vehicle-db:
        condition: service_healthy

  vinculo-vial-vehicle-db:
    container_name: vinculo-vial-vehicle-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
      POSTGRES_DB: vehicle
    volumes:
      - vinculo-vial-vehicle-data:/var/lib/postgresql/data
    networks:
      - vehicle-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehicle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Nombre fijado explícitamente: sin `name`, Compose antepone el nombre del
  # proyecto (el propio directorio) y duplicaría el prefijo vinculo-vial-vehicle.
  vinculo-vial-vehicle-data:
    name: vinculo-vial-vehicle-data

networks:
  # Red puente compartida por toda la plataforma. Es externa: la crea el
  # ecosistema (o el propio operador con `docker network create vinculo-vial`),
  # no este compose. Solo el servicio principal se conecta acá: es la única
  # superficie que otros microservicios deben poder resolver por DNS.
  vinculo-vial:
    external: true
  # Red local exclusiva de este servicio: aísla el tráfico hacia su base de
  # datos, que no debe ser alcanzable desde otros microservicios ni desde la
  # red compartida.
  vehicle-internal:
    name: vehicle-internal
